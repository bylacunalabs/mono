version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Build and test tools move together; runtime dependencies (preact, idb,
      # fflate, pdfjs-dist) get a pull request each.
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
